# ==================================================
# DRIM - Broker MQTT (Mosquitto)
# ==================================================
# Bus de ingesta: los dispositivos de trazabilidad (Impinj R700 con IoT interface,
# gateways de beacons BLE, o cualquier dispositivo RF) publican sus lecturas al tópico
# readers/{idDispositivo}/events, y DRIMBack se suscribe y las procesa.

listener 1883
protocol mqtt

# v1: acceso anónimo dentro de la red del cliente. Para producción, habilitar autenticación:
#   allow_anonymous false
#   password_file /mosquitto/config/passwd
#   (crear con: mosquitto_passwd -c /mosquitto/config/passwd drim)
# y setear MQTT_USER / MQTT_PASSWORD en el .env.
allow_anonymous true

persistence true
persistence_location /mosquitto/data/

# Logs a stdout (visibles con: docker logs drim-mqtt)
log_dest stdout
log_type warning
log_type notice
log_type information
